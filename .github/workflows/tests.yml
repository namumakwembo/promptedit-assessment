name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promptedit_assessment
          POSTGRES_USER: promptedit
          POSTGRES_PASSWORD: promptedit-local
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U promptedit -d promptedit_assessment"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U promptedit promptedit_assessment_testing

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
